[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

  # 아래 VITE_* 키들은 "브라우저 공개용" 클라이언트 식별자다(나이스정보통신 PortOne 채널 키,
  # Supabase URL·anon 키, IVS 재생 URL). Vite 가 빌드 시점에 클라이언트 번들(dist/assets/*)
  # 안으로 그대로 인라인하는 게 정상 동작이며, 시크릿이 아니다. 이 키들이 자동 민감변수
  # 목록(NETLIFY_SENSITIVE_ENV_KEYS)에 잡혀 있어, 그 값이 번들에서 발견되면 시크릿 스캔이
  # 배포를 실패시킬 수 있다 → 새 번들이 안 올라가 환경변수를 넣어도 반영되지 않는다.
  # 공개 키이므로 스캔 대상에서 제외해 배포가 항상 성공하도록 한다. (시크릿 키는 서버 전용
  # PORTONE_V2_API_SECRET / *_API_SECRET 등으로 분리돼 있고 여기에 포함하지 않는다.)
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "VITE_PORTONE_NICE_CHANNEL_KEY,VITE_PORTONE_NICE_CHANNEL_KEY_IM0029308m,VITE_PORTONE_NICE_CHANNEL_KEY_IM0029309m,VITE_TOSS_CLIENT_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_IVS_PLAYBACK_URL,VITE_BANUBA_TOKEN"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

# 토스페이먼츠 결제위젯 페이지 (정적 HTML). SPA catch-all 보다 먼저 매칭되어야 한다.
[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/fail"
  to = "/fail.html"
  status = 200

# 토스페이먼츠 직접 연동(카드) 결제 후 돌아오는 정적 페이지. SPA catch-all 보다 먼저 매칭.
[[redirects]]
  from = "/toss/return"
  to = "/toss-return.html"
  status = 200

[[redirects]]
  from = "/toss/fail"
  to = "/toss-fail.html"
  status = 200

# PortOne(토스페이·카카오페이) 간편결제 리다이렉트 복귀 정적 페이지. SPA catch-all 보다 먼저 매칭.
[[redirects]]
  from = "/portone/return"
  to = "/portone-return.html"
  status = 200

[[redirects]]
  from = "/auth-callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/membership"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200

# 해시가 붙은 빌드 산출물은 SPA catch-all 로 넘기지 않는다.
#
# 새 배포가 올라가면 브라우저에 열려 있던 예전 index.html 은 사라진 파일명
# (/assets/DmAutomation-a1b2c3.js)을 계속 요청한다. 그 요청이 아래 catch-all 에
# 걸리면 Netlify 는 index.html 을 200 · text/html 로 돌려주는데, 브라우저 모듈
# 로더는 "JS 모듈이 아니다"로 이 응답을 영구히 거부한다. 재시도해도 같은 HTML 이
# 오므로 그 화면은 계속 로딩 중에 머문다(디엠 자동화 메뉴가 그랬다).
#
# 없는 파일은 404 로 분명히 실패해야 앱이 청크 오류로 알아보고 새 매니페스트를
# 받아오는 새로고침으로 회복할 수 있다. 파일이 실제로 있으면 정적 파일이 먼저
# 서브되므로(force 기본값 false) 정상 요청에는 영향이 없다.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

# SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 빌드 산출물은 1년 immutable 로 캐시한다.
#
# 이 규칙이 없으면 Netlify 기본값이 적용돼 `cache-control: public,max-age=0,
# must-revalidate` 로 나갔다. 파일명에 내용 해시가 붙어 있어서 내용이 바뀌면 이름도
# 바뀌는데(=사실상 불변), 재방문할 때마다 JS · CSS 청크 하나하나에 "안 바뀌었나요"
# 왕복이 붙었다. 모바일 왕복 100~200ms × 6~7개면 재방문마다 순수 대기만 수백 ms 다.
#
# /assets/ 에는 해시가 붙은 파일만 둔다. 해시가 없는 파일(직접 관리하는 스크립트)은
# /vendor/ 로 옮겼다 — 여기에 함께 두면 고친 내용이 1년 동안 전달되지 않는다.
# 겹치는 헤더 규칙은 만들지 않는다: 같은 헤더 이름이 여러 규칙에서 나올 때 Netlify 가
# 값을 이어 붙이는지 덮어쓰는지 문서에 없어서, 서로 모순되는 캐시 지시가 나갈 수 있다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# 직접 관리하는 스크립트는 이름이 그대로이므로 짧게 캐시하고 매번 확인한다.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    cache-control = "public, max-age=600, must-revalidate"

# 폰트 · 아이콘처럼 이름이 고정된 정적 파일은 하루 캐시로 왕복을 줄인다.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    cache-control = "public, max-age=86400"

