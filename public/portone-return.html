<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/platform-language.js" defer></script>
  <title>결제 처리 중 · 픽스폴리오</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
        "Malgun Gothic", system-ui, sans-serif;
      background: #f2f4f6; color: #191f28;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 36px 28px; width: 100%; max-width: 420px;
      margin: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); text-align: center;
    }
    .icon { font-size: 44px; line-height: 1; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #4e5968; font-size: 14px; line-height: 1.7; margin: 4px 0; }
    a.btn { display: inline-block; margin-top: 22px; padding: 13px 20px; border-radius: 12px;
      background: #3182f6; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; }
    .muted { color: #8b95a1; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">⏳</div>
    <h1>결제를 처리하는 중이에요</h1>
    <p class="muted">잠시만 기다려 주세요…</p>
  </div>

  <script>
    // PortOne(포트원) 결제(카드 = 나이스정보통신 / 카카오페이) 리다이렉트 복귀 처리.
    //
    // 결제창에서 결제가 끝나면 PortOne 이 redirectUrl 로
    // 결과 쿼리(paymentId / billingKey / code …)를 붙여 돌려보낸다. 결제 시작 직전에 저장해 둔
    // intent 와 합쳐 서버에서 검증·적립을 마무리한다. (시크릿 키는 서버 전용.)
    const params = new URLSearchParams(location.search);
    // PortOne V2 redirect 결과: 실패 시에만 code 가 채워진다.
    const code = params.get("code");
    const message = params.get("message");
    const pgMessage = params.get("pgMessage");
    const paymentId = params.get("paymentId");
    const billingKey = params.get("billingKey");

    const card = document.getElementById("card");
    const INTENT_KEY = "portone_pending_intent";

    let intent = null;
    try { intent = JSON.parse(sessionStorage.getItem(INTENT_KEY) || "null"); } catch (e) {}

    function fail(msg, errCode) {
      const back = (intent && intent.returnPath) || "/";
      card.innerHTML =
        '<div class="icon">❌</div>' +
        '<h1>결제에 실패했어요</h1>' +
        '<p>' + (msg || "결제가 정상적으로 처리되지 않았습니다.") + '</p>' +
        (errCode ? '<p class="muted">오류 코드: ' + errCode + '</p>' : '') +
        '<a class="btn" href="' + back + '">돌아가기</a>';
    }

    function done(returnPath) {
      const back = returnPath || "/";
      card.innerHTML =
        '<div class="icon">✅</div>' +
        '<h1>결제가 완료되었어요</h1>' +
        '<p class="muted">잠시 후 자동으로 이동합니다…</p>' +
        '<a class="btn" href="' + back + '">돌아가기</a>';
      setTimeout(function () { location.replace(back); }, 1400);
    }

    function enc(s) { return encodeURIComponent(String(s).toLowerCase()); }

    // 결제 마무리 API(멤버십 · 클로드 · 라이브 충전)는 모두 "본인 계정인지" 확인한다
    // (netlify/functions/_shared/user-auth.mts). 이 페이지는 SPA 밖의 정적 화면이라
    // apiService 의 authHeaders 를 쓸 수 없으므로, 브라우저에 저장된 로그인 토큰을 직접 읽어
    // Authorization 헤더로 붙인다. 토큰 없이 보내면 결제는 됐는데 적립·활성화만 401 로
    // 실패한다. (저장 위치는 apiService 와 같다 — 일반/운영자 회원은 Supabase 세션,
    // 비즈니스 계정은 picks_business_access_token.)
    function readLocal(key) {
      try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
    }

    function normalizeAccount(raw) {
      return String(raw || "").replace(/^biz\//, "").trim().toLowerCase();
    }

    // 만료된 토큰은 보내지 않는다(서버가 401 로 돌려주고 다른 토큰을 시도할 기회를 잃는다).
    function usableToken(token) {
      if (!token) return "";
      try {
        const payload = token.split(".")[1];
        if (!payload) return token;
        const json = JSON.parse(
          decodeURIComponent(
            atob(payload.replace(/-/g, "+").replace(/_/g, "/"))
              .split("")
              .map(function (ch) { return "%" + ("00" + ch.charCodeAt(0).toString(16)).slice(-2); })
              .join(""),
          ),
        );
        if (typeof json.exp !== "number") return token;
        return json.exp * 1000 - Date.now() > 30000 ? token : "";
      } catch (e) {
        return token;
      }
    }

    // Supabase 세션 키는 `sb-<ref>-auth-token` 이고, 탭별 계정 슬롯(accountScope)이 붙으면
    // 뒤에 `@@operator` 같은 접미사가 더해진다 — 형태로 훑어 찾는다.
    function supabaseToken() {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || k.indexOf("sb-") !== 0 || k.indexOf("-auth-token") === -1) continue;
          let stored = null;
          try { stored = JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { continue; }
          const session = stored && stored.currentSession ? stored.currentSession : stored;
          const token = usableToken(session && session.access_token);
          if (token) return token;
        }
      } catch (e) {}
      return "";
    }

    function authToken(username) {
      const businessToken = usableToken(readLocal("picks_business_access_token"));
      const businessAccount = normalizeAccount(readLocal("picks_business_session"));
      // 비즈니스 계정으로 결제한 건이면 비즈니스 토큰이 맞다. 한 브라우저에 두 세션이 함께
      // 남아 있을 수 있어(로그아웃이 서로의 키를 지우지 않는다) 결제 주인으로 골라야 한다.
      if (businessToken && businessAccount && businessAccount === normalizeAccount(username)) {
        return businessToken;
      }
      return supabaseToken() || businessToken;
    }

    async function send(method, url, body) {
      const headers = { "Content-Type": "application/json" };
      const token = authToken(intent && intent.username);
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(url, {
        method: method,
        headers: headers,
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(function () { return {}; });
      return { ok: res.ok, data: data };
    }

    async function finalize() {
      if (!intent || !intent.type) {
        fail("결제 정보가 만료되었습니다. 다시 시도해 주세요.");
        return;
      }

      // PortOne 이 code 를 붙여 돌아오면 결제 실패/취소다.
      if (code) {
        fail(pgMessage || message || "결제가 취소되었거나 실패했습니다.", code);
        return;
      }

      const payMethod = intent.payMethod || "CARD";

      // ── 멤버십 ──
      if (intent.type === "membership") {
        // 멤버십은 매월 자동결제(정기결제)뿐이다. 간편결제(카카오페이) 빌링키 등록은
        // billingKey 로 돌아온다. (카드 정기결제는 결제창을 쓰지 않고 서버 키인 발급이라
        //  이 페이지를 거치지 않는다.)
        if (!billingKey) { fail("빌링키를 받지 못했습니다. 다시 시도해 주세요."); return; }
        const r = await send("POST", "/api/billing-issue", {
          username: intent.username,
          tier: intent.tier,
          billingKey: billingKey,
        });
        if (!r.ok || !r.data.success) { fail(r.data.error || "멤버십 결제에 실패했습니다."); return; }
        sessionStorage.removeItem(INTENT_KEY);
        done(intent.returnPath);
        return;
      }

      // ── 단건 결제 흐름 ── paymentId 로 돌아온다.
      if (!paymentId) { fail("결제 정보가 올바르지 않습니다."); return; }

      if (intent.type === "live") {
        const r = await send("POST", "/api/live-credits/" + enc(intent.username), {
          hours: intent.hours,
          payMethod: payMethod,
          paymentId: paymentId,
        });
        if (!r.ok || r.data.error) { fail(r.data.error || "시간 충전에 실패했습니다."); return; }
        sessionStorage.removeItem(INTENT_KEY);
        done(intent.returnPath);
        return;
      }

      if (intent.type === "claude") {
        const r = await send("POST", "/api/claude-credits/" + enc(intent.username), {
          kind: intent.kind || "activation",
          amountKrw: intent.amountKrw,
          payMethod: payMethod,
          paymentId: paymentId,
        });
        if (!r.ok || r.data.error || r.data.success === false) {
          fail(r.data.error || "크레딧 적립에 실패했습니다."); return;
        }
        sessionStorage.removeItem(INTENT_KEY);
        done(intent.returnPath);
        return;
      }

      // ── 라이브 커머스 시청자 주문 ── 저장해 둔 주문 본문에 paymentId 만 더해 검증한다.
      if (intent.type === "live-order" || intent.type === "live-order-batch") {
        const url = intent.type === "live-order"
          ? "/api/live-order-complete"
          : "/api/live-order-batch";
        const order = intent.order || {};
        const r = await send("POST", url, Object.assign({}, order, { paymentId: paymentId }));
        if (!r.ok || !r.data.success) { fail(r.data.error || "결제 검증에 실패했습니다."); return; }
        sessionStorage.removeItem(INTENT_KEY);
        done(intent.returnPath);
        return;
      }

      fail("결제 정보가 올바르지 않습니다.");
    }

    finalize().catch(function (err) {
      fail((err && err.message) || "결제 처리 중 오류가 발생했습니다.");
    });
  </script>
</body>
</html>
