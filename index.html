<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!--
      interactive-widget=overlays-content: when the on-screen keyboard opens it
      OVERLAYS the page without resizing either viewport. This keeps the live
      player's fixed, full-screen container perfectly pinned while a viewer types
      in chat. `resizes-content` (the previous value) shrank the layout viewport,
      dragging the fixed player up and briefly revealing the host's page behind it
      ("화면이 솟는" surge). The chat input is lifted above the keyboard manually
      via the VisualViewport API (see LiveStream.tsx); ordinary form inputs are
      still scrolled into view by the browser within the unchanged layout viewport.
    -->
    <!--
      maximum-scale=1.0, user-scalable=no: lock the visual viewport so the page
      never zooms. Without this, focusing a text field or double-tapping on
      mobile magnifies the layout and leaves it stuck mid-zoom — disorienting in
      the full-screen broadcast/live views. Combined with the >=16px input
      font-size rule in index.css, this keeps the screen fixed at all times.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="theme-color" content="#2563EB">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%232563EB%22/></svg>">
    <title>PICKSFOLIO | 일상을 큐레이션하다</title>
    <meta property="og:title" content="PICKS | 일상을 큐레이션하다" />
    <meta property="og:description" content="단 하나의 링크, PICKS. 무신사-올리브영 데이터로 픽하고, 감각적인 그리드 템플릿으로 연결하세요." />
    <meta property="og:image" content="https://picks-folio.com/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://picks-folio.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PICKS | 일상을 큐레이션하다" />
    <meta name="twitter:description" content="단 하나의 링크, PICKS. 무신사-올리브영 데이터로 픽하고, 감각적인 그리드 템플릿으로 연결하세요." />
    <meta name="twitter:image" content="https://picks-folio.com/og-image.png" />
    <!--
      폰트는 가변(variable) 판의 dynamic-subset 을 쓴다.
      static 판은 굵기마다 한글 전체가 담긴 약 780KB woff2 를 따로 받는다. 홈과
      크리에이터 페이지는 400·500·700·900 네 굵기를 쓰므로 그것만으로 3MB 가 넘었고
      (첫 방문 전송량의 83%), 그 3MB 가 리액트 청크와 회선을 다투는 동안 화면이
      눌리지 않았다. dynamic-subset 은 실제로 쓰인 글자 구간만 조각(조각당 약 35KB)
      으로 받고 모든 굵기가 한 파일에 들어 있어 0.1~0.25MB 로 끝난다.
      index.css 의 --font-sans 는 이미 "Pretendard Variable" 을 먼저 적고 있다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <!--
      /assets/ 밖에 둔다. 그 폴더의 나머지는 파일명에 내용 해시가 붙는 빌드 산출물이라
      netlify.toml 에서 1년 immutable 캐시를 걸었는데, 이 파일은 해시가 없어 같은
      이름으로 내용이 바뀐다 — 같은 규칙에 들어가면 고친 내용이 1년 동안 전달되지 않는다.
    -->
    <script src="/vendor/ivs-player-overlay.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      video.js 와 포트원 결제 SDK 는 여기서 부르지 않는다.
      둘은 defer 가 없는 일반 <script> 였고, 위의 모듈 진입점은 defer 로 동작하므로
      리액트는 이 두 개(합계 260KB, 서로 다른 도메인 두 곳)가 내려오고 실행될 때까지
      시작하지 못했다 — 라이브도 결제도 열지 않는 방문자까지 그 대기를 물었다.
      지금은 필요한 화면이 utils/externalScripts.ts 로 그 자리에서 불러온다.
    -->
    <script src="/campaign-inject.js" defer></script>
    <script>
    window.__picksLinkAccount=function(username,kakaoUserId){
      return new Promise(function(resolve){
        var overlay=document.createElement("div");
        overlay.style.cssText="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:24px";
        overlay.innerHTML='<div style="background:#fff;border-radius:24px;padding:32px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)">'
          +'<h3 style="font-size:18px;font-weight:900;color:#1e293b;margin:0 0 8px">기존 계정 연동</h3>'
          +'<p style="font-size:13px;color:#64748b;margin:0 0 20px;line-height:1.5"><b>'+username+'</b> 계정이 이미 존재합니다.<br>비밀번호를 입력하면 카카오 계정과 연동됩니다.</p>'
          +'<input id="__picks_link_pw" type="password" placeholder="기존 계정 비밀번호" style="width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;margin-bottom:8px">'
          +'<p id="__picks_link_err" style="font-size:12px;color:#ef4444;margin:0 0 16px;min-height:18px"></p>'
          +'<div style="display:flex;gap:10px">'
          +'<button id="__picks_link_cancel" style="flex:1;padding:14px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;font-size:15px;font-weight:700;color:#64748b;cursor:pointer">취소</button>'
          +'<button id="__picks_link_ok" style="flex:1;padding:14px;border-radius:12px;border:none;background:#2563EB;font-size:15px;font-weight:700;color:#fff;cursor:pointer">연동하기</button>'
          +'</div></div>';
        document.body.appendChild(overlay);
        var pw=overlay.querySelector("#__picks_link_pw");
        var err=overlay.querySelector("#__picks_link_err");
        var ok=overlay.querySelector("#__picks_link_ok");
        var cancel=overlay.querySelector("#__picks_link_cancel");
        pw.focus();
        function close(result){document.body.removeChild(overlay);resolve(result)}
        cancel.onclick=function(){close(null)};
        overlay.onclick=function(ev){if(ev.target===overlay)close(null)};
        pw.onkeydown=function(ev){if(ev.key==="Enter")doLink()};
        ok.onclick=doLink;
        function doLink(){
          var val=pw.value.trim();
          if(!val){err.textContent="비밀번호를 입력해 주세요.";return}
          ok.disabled=true;ok.textContent="연동 중...";err.textContent="";
          fetch("/api/kakao-link-account",{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({kakao_user_id:kakaoUserId,username:username,password:val})
          }).then(function(r){return r.json()}).then(function(d){
            if(d.success){close(d)}
            else{err.textContent=d.error||"연동에 실패했습니다.";ok.disabled=false;ok.textContent="연동하기"}
          }).catch(function(){err.textContent="네트워크 오류가 발생했습니다.";ok.disabled=false;ok.textContent="연동하기"});
        }
      });
    };
    </script>
</body>
</html>
