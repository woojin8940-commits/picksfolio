<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!--
      interactive-widget=overlays-content: when the on-screen keyboard opens it
      OVERLAYS the page without resizing either viewport. This keeps the live
      player's fixed, full-screen container perfectly pinned while a viewer types
      in chat. `resizes-content` (the previous value) shrank the layout viewport,
      dragging the fixed player up and briefly revealing the host's page behind it
      ("화면이 솟는" surge). The chat input is lifted above the keyboard manually
      via the VisualViewport API (see LiveStream.tsx); ordinary form inputs are
      still scrolled into view by the browser within the unchanged layout viewport.
    -->
    <!--
      maximum-scale=1.0, user-scalable=no: lock the visual viewport so the page
      never zooms. Without this, focusing a text field or double-tapping on
      mobile magnifies the layout and leaves it stuck mid-zoom — disorienting in
      the full-screen broadcast/live views. Combined with the >=16px input
      font-size rule in index.css, this keeps the screen fixed at all times.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="theme-color" content="#2563EB">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%232563EB%22/></svg>">
    <title>PICKSFOLIO | 크리에이터를 위한 올인원 서비스</title>
    <meta property="og:title" content="PICKS | 크리에이터를 위한 올인원 서비스" />
    <meta property="og:description" content="크리에이터를 위한 올인원 서비스, PICKS. 데이터로 픽하고, 나만의 홈페이지 템플릿으로 연결하세요." />
    <meta property="og:image" content="https://picks-folio.com/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://picks-folio.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PICKS | 크리에이터를 위한 올인원 서비스" />
    <meta name="twitter:description" content="크리에이터를 위한 올인원 서비스, PICKS. 데이터로 픽하고, 나만의 홈페이지 템플릿으로 연결하세요." />
    <meta name="twitter:image" content="https://picks-folio.com/og-image.png" />
    <!--
      폰트는 가변(variable) 판의 dynamic-subset 을 쓴다.
      static 판은 굵기마다 한글 전체가 담긴 약 780KB woff2 를 따로 받는다. 홈과
      크리에이터 페이지는 400·500·700·900 네 굵기를 쓰므로 그것만으로 3MB 가 넘었고
      (첫 방문 전송량의 83%), 그 3MB 가 리액트 청크와 회선을 다투는 동안 화면이
      눌리지 않았다. dynamic-subset 은 실제로 쓰인 글자 구간만 조각(조각당 약 35KB)
      으로 받고 모든 굵기가 한 파일에 들어 있어 0.1~0.25MB 로 끝난다.
      index.css 의 --font-sans 는 이미 "Pretendard Variable" 을 먼저 적고 있다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://rjksilpewohjvtbxrsvu.supabase.co" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <!--
      /assets/ 밖에 둔다. 그 폴더의 나머지는 파일명에 내용 해시가 붙는 빌드 산출물이라
      netlify.toml 에서 1년 immutable 캐시를 걸었는데, 이 파일은 해시가 없어 같은
      이름으로 내용이 바뀐다 — 같은 규칙에 들어가면 고친 내용이 1년 동안 전달되지 않는다.
    -->
    <script src="/vendor/ivs-player-overlay.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <!--
      로그인 콜백으로 들어온 방문에만, 리액트가 뜨기 전 자리를 지키는 로딩 화면.

      카카오 간편로그인 콜백은 main.tsx 가 인가 코드를 세션으로 바꾼 다음에야 앱을
      그린다(그 전에 그리면 App.tsx 의 OAuth 처리가 카카오가 준 코드를 자기 것으로
      착각한다). 그 교환은 네트워크를 한 번 타므로 그동안 #root 는 비어 있었고,
      화면에는 body 색인 검정만 남았다 — 로그인하는 사람에게는 "눌렀는데 검은
      화면이 한참 있다가 무언가 뜨는" 첫 번째 깜빡임이었다.

      그래서 그 구간에만 AuthLoadingScreen 과 똑같은 그림을 정적 마크업으로 미리
      그려 둔다. 리액트가 뜨면 createRoot 가 #root 안을 비우고 같은 화면을 이어
      그리므로, 넘어가는 순간이 보이지 않는다. 색·크기·문구는 반드시
      src/components/AuthLoadingScreen.tsx 와 같이 유지해야 한다.

      로그인 콜백이 아닌 보통의 방문(개인페이지 등)에는 아무것도 그리지 않는다.
      모든 방문에 스피너를 깔면, 지금은 조용히 뜨던 개인페이지에 없던 스피너가
      한 번 번쩍이게 된다.
    -->
    <script>
      (function () {
        try {
          var loc = window.location;
          var isAuthCallback =
            loc.pathname === '/auth-callback' ||
            /[?&](code|kakao_login)=/.test(loc.search) ||
            /access_token=/.test(loc.hash);
          if (!isAuthCallback) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;background:#050507" role="status" aria-live="polite">' +
            '<div style="width:40px;height:40px;border:3px solid #60a5fa;border-top-color:transparent;' +
            'border-radius:9999px;animation:picks-boot-spin 1s linear infinite"></div>' +
            '<p style="margin:1rem 0 0;font-size:0.875rem;font-weight:700;color:#cbd5e1">로그인 중입니다</p>' +
            '</div>';
          var style = document.createElement('style');
          style.textContent = '@keyframes picks-boot-spin{to{transform:rotate(360deg)}}';
          document.head.appendChild(style);
        } catch (e) {
          // 로딩 표시는 곁가지다. 실패해도 앱이 뜨는 것을 막지 않는다.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      video.js 와 포트원 결제 SDK 는 여기서 부르지 않는다.
      둘은 defer 가 없는 일반 <script> 였고, 위의 모듈 진입점은 defer 로 동작하므로
      리액트는 이 두 개(합계 260KB, 서로 다른 도메인 두 곳)가 내려오고 실행될 때까지
      시작하지 못했다 — 라이브도 결제도 열지 않는 방문자까지 그 대기를 물었다.
      지금은 필요한 화면이 utils/externalScripts.ts 로 그 자리에서 불러온다.
    -->
    <script src="/campaign-inject.js" defer></script>
</body>
</html>
