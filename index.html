<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <!--
      maximum-scale=1.0, user-scalable=no: lock the visual viewport so the page
      never zooms. Without this, focusing a text field or double-tapping on
      mobile magnifies the layout and leaves it stuck mid-zoom. Combined with the
      >=16px input font-size rule in index.css, this keeps the screen fixed at
      all times.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#2563EB">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%232563EB%22/></svg>">
    <title>픽스폴리오 - 인플루언서·브랜드 협업 플랫폼 | PICKSFOLIO</title>
    <!--
      검색 결과와 링크 미리보기에 그대로 실리는 소개글. 자바스크립트를 돌리지 않는
      크롤러(네이버 Yeti, 카카오톡 미리보기 등)도 읽어야 하므로 반드시 이 정적
      HTML 에 둔다 — 스크립트로 바꿔 넣지 않는다.
      서비스명은 "픽스폴리오" 또는 "PICKSFOLIO" 로만 쓴다("PICKS" 단독 표기 금지).
      개인페이지(/아이디)에는 크리에이터 본인의 소개글이 들어가야 하므로,
      netlify/edge-functions/og-image.ts 가 크롤러에게만 이 줄들을 바꿔 준다.
    -->
    <meta name="description" content="픽스폴리오는 인플루언서와 브랜드를 연결해요. 자동 DM, 브랜드 매칭, 개인 페이지, 판매 연동까지 한 곳에서." />
    <meta property="og:site_name" content="픽스폴리오" />
    <meta property="og:title" content="픽스폴리오 - 인플루언서·브랜드 협업 플랫폼" />
    <meta property="og:description" content="픽스폴리오는 인플루언서와 브랜드를 연결해요. 자동 DM, 브랜드 매칭, 개인 페이지, 판매 연동까지 한 곳에서." />
    <meta property="og:image" content="https://picks-folio.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://picks-folio.com/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="픽스폴리오 - 인플루언서·브랜드 협업 플랫폼" />
    <meta name="twitter:description" content="픽스폴리오는 인플루언서와 브랜드를 연결해요. 자동 DM, 브랜드 매칭, 개인 페이지, 판매 연동까지 한 곳에서." />
    <meta name="twitter:image" content="https://picks-folio.com/og-image.png?v=2" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"픽스폴리오","alternateName":["PICKSFOLIO","Picksfolio","picks-folio"],"url":"https://picks-folio.com/","logo":"https://picks-folio.com/og-image.png?v=2"}</script>
    <!--
      폰트는 가변(variable) 판의 dynamic-subset 을 쓴다.
      static 판은 굵기마다 한글 전체가 담긴 약 780KB woff2 를 따로 받는다. 홈과
      크리에이터 페이지는 400·500·700·900 네 굵기를 쓰므로 그것만으로 3MB 가 넘었고
      (첫 방문 전송량의 83%), 그 3MB 가 리액트 청크와 회선을 다투는 동안 화면이
      눌리지 않았다. dynamic-subset 은 실제로 쓰인 글자 구간만 조각(조각당 약 35KB)
      으로 받고 모든 굵기가 한 파일에 들어 있어 0.1~0.25MB 로 끝난다.
      index.css 의 --font-sans 는 이미 "Pretendard Variable" 을 먼저 적고 있다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://rjksilpewohjvtbxrsvu.supabase.co" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<!-- Meta Pixel Code -->
<script>

</head>
<body>
<!-- Meta Pixel Code (noscript) — <head> 안의 <noscript><img> 는 Vite HTML 파서가 거부해 body 첫 줄에 둔다. -->
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=3504523199721217&ev=PageView&noscript=1"
/></noscript>
    <!--
      #root 안의 h1 은 자바스크립트 없이도 메인 HTML 에 서비스명("픽스폴리오")이
      보이게 하는 정적 제목이다. 리액트가 뜨면 createRoot 가 #root 안을 비우고 홈
      화면으로 갈아 끼운다. 메인 홈(/)이 아닌 주소에서는 바로 아래 스크립트가
      그리기 전에 지운다(개인페이지에 홈 제목이 번쩍이지 않게).
      netlify/edge-functions/og-image.ts 가 이 마크업을 그대로 찾아 바꾸므로,
      고치면 그쪽 STATIC_ROOT 도 함께 맞춘다.
    -->
    <div id="root"><h1 id="static-home-title" style="position:fixed;inset:0;margin:0;padding:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#F4F5FA;font-size:1.5rem;font-weight:900;letter-spacing:-0.05em;color:#0B0F1A">픽스폴리오 <span style="display:block;margin-top:0.5rem;font-size:0.875rem;font-weight:700;letter-spacing:0;color:#4A5273">인플루언서·브랜드 협업 플랫폼 PICKSFOLIO</span></h1></div>
    <!--
      로그인 콜백으로 들어온 방문에만, 리액트가 뜨기 전 자리를 지키는 로딩 화면.

      카카오 간편로그인 콜백은 main.tsx 가 인가 코드를 세션으로 바꾼 다음에야 앱을
      그린다(그 전에 그리면 App.tsx 의 OAuth 처리가 카카오가 준 코드를 자기 것으로
      착각한다). 그 교환은 네트워크를 한 번 타므로 그동안 #root 는 비어 있었고,
      화면에는 body 색인 검정만 남았다 — 로그인하는 사람에게는 "눌렀는데 검은
      화면이 한참 있다가 무언가 뜨는" 첫 번째 깜빡임이었다.

      그래서 그 구간에만 AuthLoadingScreen 과 똑같은 그림을 정적 마크업으로 미리
      그려 둔다. 리액트가 뜨면 createRoot 가 #root 안을 비우고 같은 화면을 이어
      그리므로, 넘어가는 순간이 보이지 않는다. 색·크기·문구는 반드시
      src/components/AuthLoadingScreen.tsx 와 같이 유지해야 한다 — 지금은 홈과
      로그인 화면과 같은 종이색(#F4F5FA)에 PICKS 표시와 파란 스피너다.

      로그인 콜백이 아닌 보통의 방문(개인페이지 등)에는 아무것도 그리지 않는다.
      모든 방문에 스피너를 깔면, 지금은 조용히 뜨던 개인페이지에 없던 스피너가
      한 번 번쩍이게 된다.
    -->
    <script>
      (function () {
        try {
          var loc = window.location;
          var isAuthCallback =
            loc.pathname === '/auth-callback' ||
            /[?&](code|kakao_login)=/.test(loc.search) ||
            /access_token=/.test(loc.hash);
          var root = document.getElementById('root');
          if (!root) return;
          if (!isAuthCallback) {
            if (loc.pathname !== '/') root.innerHTML = '';
            return;
          }
          // body 색도 함께 종이색으로 바꾼다. 이 화면은 fixed 라 overscroll
          // 되돌림 구간과 데스크톱 확대가 남기는 바깥 여백을 덮지 못한다.
          // AuthLoadingScreen 이 자리를 이어받은 뒤 이 인라인 색을 치운다.
          document.body.style.backgroundColor = '#F4F5FA';
          root.innerHTML =
            '<div style="position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;background:#F4F5FA' +
            ';background-image:radial-gradient(circle at 50% 38%, rgba(37,99,235,0.16), transparent 62%),' +
            'radial-gradient(rgba(11,15,26,0.0385) 1px, transparent 1px);background-size:auto, 22px 22px"' +
            ' role="status" aria-live="polite">' +
            '<div style="display:flex;align-items:center;gap:0.375rem">' +
            '<span style="font-size:1.5rem;font-weight:900;letter-spacing:-0.05em;color:#0B0F1A">PICKS</span>' +
            '<span style="width:6px;height:6px;border-radius:9999px;background:#2563EB;' +
            'transform:translateY(6px)"></span></div>' +
            '<div style="width:40px;height:40px;margin-top:1.5rem;border:3px solid rgba(37,99,235,0.18);' +
            'border-top-color:#2563EB;border-radius:9999px;animation:picks-boot-spin 1s linear infinite"></div>' +
            '<p style="margin:1rem 0 0;font-size:0.875rem;font-weight:700;color:#4A5273">로그인 중입니다</p>' +
            '</div>';
          var style = document.createElement('style');
          style.textContent = '@keyframes picks-boot-spin{to{transform:rotate(360deg)}}';
          document.head.appendChild(style);
        } catch (e) {
          // 로딩 표시는 곁가지다. 실패해도 앱이 뜨는 것을 막지 않는다.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      포트원 결제 SDK 는 여기서 부르지 않는다.
      defer 가 없는 일반 <script> 였고, 위의 모듈 진입점은 defer 로 동작하므로
      리액트는 그것이 내려오고 실행될 때까지 시작하지 못했다 — 결제를 열지 않는
      방문자까지 그 대기를 물었다.
      지금은 필요한 화면이 utils/externalScripts.ts 로 그 자리에서 불러온다.
    -->
</body>
</html>
